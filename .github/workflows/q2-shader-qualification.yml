name: Q2 shader compilation experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-fixture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select an installed Xcode 26 toolchain
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
      - name: Compile only the frozen diagnostic fixture
        run: |
          python3 Tools/q2_shader_compilation.py \
            --fixture Tools/fixtures/q2-shader-compilation/fixture.json \
            --output .build/q2-shader-qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-shader-qualification
          path: .build/q2-shader-qualification/
          if-no-files-found: error
          retention-days: 14
